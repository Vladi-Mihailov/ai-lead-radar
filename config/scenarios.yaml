  # Люди, собирающиеся ехать на машине через границу/в Грузию/из Грузии —
  # ценный потенциальный автомобильный лид, даже если они не упоминают
  # страховку/штраф/перевод напрямую (см. задачу). НАМЕРЕННО НЕ используются
  # голые общие слова вроде "сколько"/"можно"/"обстановка"/"ехать" САМИ ПО
  # СЕБЕ — они матчили бы вообще любой разговор ни о чём. Вместо этого —
  # либо устойчивые многословные фразы (вопрос + граница/дорога/перевал),
  # либо узкие глагольные/именные корни, однозначно привязанные к
  # пересечению границы (проезд/выезд/очередь), а не общеупотребимые сами
  # по себе. "обстановка"/"ситуация" оставлены ТОЛЬКО в связке с "на
  # границе/на дороге/на перевале" — иначе матчился бы любой бытовой
  # разговор про обстановку где угодно (см. задачу, негативный пример
  # "какая обстановка в городе").
  - name: car_border_crossing
    enabled: true
    keywords:
      # Сама граница — сейчас/сегодня, устойчивые фразы (не голое "граница")
      - "как граница"
      - "как на границе"
      - "что на границе"
      - "что там на границе"
      - "открыта граница"
      - "граница открыта"
      - "закрыта граница"
      - "граница закрыта"

      # "Обстановка"/"ситуация" — ТОЛЬКО в привязке к границе/дороге/перевалу
      - "какая обстановка на границе"
      - "как обстановка на границе"
      - "какая обстановка на дороге"
      - "как обстановка на перевале"

      # Собираются выезжать/проезжать — глагольные корни (выезд/проезд),
      # покрывают склонения ("выезжать"/"выезжаю"/"выезжает" и т.п.), не
      # ловя при этом омонимичные слова вроде "проедать"/"проедаем" деньги
      # (стем короче — "проед" — задел бы и их, поэтому здесь конкретные
      # спряжения, а не общий стем).
      - "выезжа"
      - "выеха"
      - "проезжа"
      - "проех"
      - "проеду"
      - "проедет"
      - "проедешь"
      - "проедем"
      - "можно выезжать"
      - "можно выехать"
      - "можно проехать"
      - "можно ли проехать"
      - "можно ли выехать"
      - "можно ехать"
      - "сколько ехать"

      # Пропускной режим на границе
      - "выпускают"
      - "выпускают ли"
      - "пропускают"
      - "пропускают ли"

      # Очередь на границе/времени прохождения — точные словоформы
      # ("очеред" как стем задел бы "очередной"/"очередная" — не то же самое)
      - "очередь"
      - "очереди"
      - "очередью"
      - "сколько стоять"
      - "сколько ждать"
      - "сколько времени на границе"
      - "сколько времени проходить границу"
      - "за сколько проеду"
      - "за сколько поеду"
      - "сколько проходить границу"
      - "сколько сейчас проходить"

      # Дорога (состояние дороги, а не "дорого" в смысле цены — короткие
      # устойчивые фразы, не голый стем "дорог", который ловил бы и цену)
      - "как дорога"
      - "какая дорога"
      - "что с дорогой"

      # Перевал / Верхний Ларс — характерный пограничный переход
      - "перевал открыт"
      - "перевал закрыт"
      - "как перевал"
      - "что на перевале"
      - "ларс"

