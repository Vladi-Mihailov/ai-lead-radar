telegram:
  # Два независимых Telethon-сессии одного и того же аккаунта — намеренно
  # не общий файл: main.py работает круглосуточно и слушает live-апдейты,
  # sync_users.py делает точечные запросы (участники + история). Общий
  # .session-файл у Telethon хранится без WAL и оба процесса писали бы в
  # него параллельно (в т.ч. состояние апдейтов pts/qts) — риск конфликтов.
  #
  # session_name_live необязателен: если не задан здесь и не задан
  # TELEGRAM_SESSION_NAME в .env — используется reader_live по умолчанию.
  # Значение ниже соответствует умолчанию и оставлено для наглядности —
  # его можно удалить без изменения поведения.
  session_name_live: reader_live    # main.py
  session_name_sync: reader_sync    # sync_users.py (обязателен, не меняется через .env)

  # Явные исключения — проверяются раньше автоматического определения бота
  # (is_bot) и раньше очереди/сохранения сообщения. Оба списка необязательны,
  # по умолчанию пустые.
  ignored_sender_ids: []      # например: [123456789]
  ignored_usernames:          # регистр и "@" не важны
    - KrayZemli_Bot
    - Livinginsrb
    - Sladkov_A_L
  ignored_display_names:      # точное совпадение отображаемого имени
    - "Аркадий"

app:
  log_level: INFO
  groups_file: config/groups.yaml
  scenarios_file: config/scenarios.yaml
  leads_output_file: data/output/leads.jsonl
  users_db_file: data/users.db

# Мониторинг штрафов police.ge (см. reader/jobs/fine_job.py). Работает в
# том же процессе и на том же Telegram-клиенте, что и основной Reader —
# отдельного подключения к Telegram не создаёт.
fine_monitor:
  enabled: true
  timezone: Asia/Tbilisi
  check_times:
    - "09:00"
    - "15:00"
    - "21:00"
  source_url: https://police.ge/protocol/index.php?lang=en
  request_timeout: 30

  # Чаты для уведомлений о новых штрафах. Если пусто — используется
  # app.lead_forward_to (LEAD_FORWARD_TO из .env), тот же чат, куда уже
  # идут лиды.
  #
  # Задано ЯВНО (а не оставлено пустым) начиная с расширения
  # LEAD_FORWARD_TO до трёх получателей лидов (@ali_na_l_i, @alena_ogi,
  # @vladimihailov, см. задачу) — иначе Fine Monitor автоматически стал
  # бы фоллбэчиться на все три через app.lead_forward_to. @alenaogir —
  # тот же получатель, что и получал уведомления Fine Monitor до этого
  # расширения (сюда же раньше фоллбэчился LEAD_FORWARD_TO).
  notification_chat_ids:
    - "@alenaogir"

  # Кому разрешены служебные команды (fine add/list/stop/check/status).
  # ОБЯЗАТЕЛЬНО заполнить Telegram User ID операторов при enabled: true —
  # с пустым списком приложение откажется запускаться (fail-fast, чтобы не
  # поднять команды, доступные любому в чате).
  allowed_user_ids:
    - 410811386

  # Архивный режим (см. reader/jobs/archive_fine_job.py) — автомобили, у
  # которых закончился обычный период (check_times, несколько раз в сутки),
  # не выпадают из мониторинга совсем, а проверяются раз в
  # archive_interval_days дней, в archive_check_hour:00 по timezone выше.
  archive_check_enabled: true
  archive_check_hour: 4
  archive_interval_days: 30
  # Safety limit на один запуск ArchiveFineJob — если после простоя backlog
  # due-задач больше лимита, остаток остаётся due и уйдёт на следующие дни,
  # ничего не теряя. 200 — с запасом относительно текущего объёма (~1000
  # машин/30 дней ≈ 34 проверки в день).
  archive_daily_limit: 200

# Постоянный фоновый режим инвайтера (python -m reader.inviter.main --worker,
# см. reader/inviter/worker.py) — равномерно распределяет приглашения во
# времени вместо разовой дневной пачки (python -m reader.inviter.main
# --execute, который продолжает работать как раньше). telegram_accounts.
# daily_limit в БД остаётся верхним суточным лимитом независимо от этих
# настроек — ниже него это только ДОПОЛНИТЕЛЬНОЕ ограничение по скорости.
inviter:
  worker:
    # Максимум успешных приглашений в час на один TelegramAccount
    # (скользящее часовое окно по фактической истории приглашений, а не
    # отдельный счётчик — см. UserCampaignInviteRepository.count_recent_sent).
    invitations_per_account_per_hour: 2
    # Как часто worker проверяет очередной аккаунт по кругу (round-robin) —
    # за один тик обрабатывается не более одного (кампания, аккаунт), поэтому
    # реальный интервал МЕЖДУ приглашениями разных аккаунтов не может быть
    # меньше этого значения — так они не приглашают одновременно.
    poll_interval_seconds: 600

# Распознавание документов автомобиля по команде "insurance ocr" в отдельном
# служебном Telegram-чате (см. reader/commands/insurance_ocr.py, reader/ocr/).
# Независимо от fine_monitor — свой чат, свои allowed_user_ids. Работает на
# том же Telegram-клиенте, что и основной Reader — второе подключение не
# создаётся. OPENAI_API_KEY — только в .env, здесь его нет и не должно быть.
#
# Если service_chat_id не задан (или OPENAI_API_KEY отсутствует в .env) —
# команда просто не поднимается, как и TelegramSink при пустом
# app.lead_forward_to.
ocr:
  # Числовой id или "@username" закрытого служебного чата — ЗАМЕНИТЕ на
  # реальный перед включением (см. README/инструкцию по установке).
  service_chat_id: "@insurance_ocr_service_chat"
  # Telegram User ID операторов, которым разрешено выполнять "insurance ocr"
  # в этом чате.
  allowed_user_ids:
    - 410811386
  vision_model: gpt-5-mini
  # Сколько секунд без новых сообщений той же альбомной группы ждать, прежде
  # чем считать альбом (несколько фото одной командой) собранным целиком.
  album_debounce_seconds: 1.5
