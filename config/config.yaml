telegram:
  # Два независимых Telethon-сессии одного и того же аккаунта — намеренно
  # не общий файл: main.py работает круглосуточно и слушает live-апдейты,
  # sync_users.py делает точечные запросы (участники + история). Общий
  # .session-файл у Telethon хранится без WAL и оба процесса писали бы в
  # него параллельно (в т.ч. состояние апдейтов pts/qts) — риск конфликтов.
  #
  # session_name_live необязателен: если не задан здесь и не задан
  # TELEGRAM_SESSION_NAME в .env — используется reader_live по умолчанию.
  # Значение ниже соответствует умолчанию и оставлено для наглядности —
  # его можно удалить без изменения поведения.
  session_name_live: reader_live    # main.py
  session_name_sync: reader_sync    # sync_users.py (обязателен, не меняется через .env)

  # Явные исключения — проверяются раньше автоматического определения бота
  # (is_bot) и раньше очереди/сохранения сообщения. Оба списка необязательны,
  # по умолчанию пустые.
  ignored_sender_ids: []      # например: [123456789]
  ignored_usernames:          # регистр и "@" не важны
    - KrayZemli_Bot
    - Livinginsrb

  ignored_display_names:      # точное совпадение отображаемого имени
    - "Аркадий"

app:
  log_level: INFO
  groups_file: config/groups.yaml
  scenarios_file: config/scenarios.yaml
  leads_output_file: data/output/leads.jsonl
  users_db_file: data/users.db
