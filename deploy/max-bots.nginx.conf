# TEMPLATE - not installed. Reverse proxy for the two MAX webhooks
# (docs/max-bots.md). MAX delivers webhooks only to https:// on port 443,
# with a certificate from a trusted CA (self-signed is rejected) and one
# endpoint per bot. The bots listen on 127.0.0.1 only and check the
# X-Max-Bot-Api-Secret header themselves.
#
# Replace max.example.com with the real domain and point its DNS A record at
# the DE server. Certificate: certbot --nginx -d max.example.com.
server {
    listen 443 ssl;
    server_name max.example.com;

    ssl_certificate     /etc/letsencrypt/live/max.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/max.example.com/privkey.pem;

    client_max_body_size 256k;
    access_log off;

    location = /max/ge/webhook {
        proxy_pass http://127.0.0.1:8781;
        proxy_read_timeout 25s;
    }

    location = /max/tr/webhook {
        proxy_pass http://127.0.0.1:8782;
        proxy_read_timeout 25s;
    }

    location / {
        return 404;
    }
}
